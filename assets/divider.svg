<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="900" y2="6" stroke="#21262D" stroke-width="1"/>
  <rect x="0" y="5" width="240" height="2" fill="url(#dg)">
    <animate attributeName="x" values="-240;900" dur="4.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>
