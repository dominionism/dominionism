<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none" role="img" aria-label="Koda — Speak it into existence">
  <defs>
    <!-- Horizontal scan sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Faint grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 L0 30" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
    <clipPath id="round"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="898" height="258" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="900" height="260" fill="url(#grid)"/>

    <!-- Slow scan sweep, always alive -->
    <rect x="-400" y="0" width="400" height="260" fill="url(#sweep)">
      <animate attributeName="x" values="-400;900" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>

    <!-- Hourglass glyph (draws itself, then sand falls forever) -->
    <g transform="translate(322,66) scale(1.45)" stroke="#FFFFFF" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path pathLength="100" d="M0,0 L44,0 L22,35 L44,70 L0,70 L22,35 Z"
            stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.4s"
                 begin="0.2s" fill="freeze"/>
      </path>

      <!-- Falling sand: top chamber -->
      <circle cx="22" cy="14" r="1.6" fill="#FFFFFF" stroke="none" opacity="0">
        <animate attributeName="cy" values="14;33" dur="1.1s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Falling sand: bottom chamber (offset stream) -->
      <circle cx="22" cy="37" r="1.6" fill="#8B949E" stroke="none" opacity="0">
        <animate attributeName="cy" values="37;56" dur="1.1s" begin="2.35s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="2.35s" repeatCount="indefinite"/>
      </circle>
      <!-- Growing sand pile at bottom -->
      <line x1="8" y1="66" x2="36" y2="66" stroke="#FFFFFF" stroke-width="3" opacity="0.9"
            stroke-dasharray="28" stroke-dashoffset="28">
        <animate attributeName="stroke-dashoffset" values="28;28;0;0" keyTimes="0;0.3;0.7;1"
                 dur="1.1s" begin="1.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- KODA wordmark: staggered rise + fade -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="300"
       fill="#FFFFFF" text-anchor="middle">
      <text x="418" y="146" opacity="0">K
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.5s" begin="0.9s" fill="freeze"/>
      </text>
      <text x="464" y="146" opacity="0">O
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.5s" begin="1.05s" fill="freeze"/>
      </text>
      <text x="510" y="146" opacity="0">D
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.5s" begin="1.2s" fill="freeze"/>
      </text>
      <text x="556" y="146" opacity="0">A
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.35s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.5s" begin="1.35s" fill="freeze"/>
      </text>
    </g>

    <!-- Subtitle: underline draws, text fades -->
    <text x="450" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13"
          font-weight="300" fill="#8B949E" text-anchor="middle" letter-spacing="4" opacity="0">SPEAK IT INTO EXISTENCE
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
    </text>
    <line x1="450" y1="212" x2="450" y2="212" stroke="#30363D" stroke-width="1">
      <animate attributeName="x1" values="450;372" dur="0.7s" begin="1.9s" fill="freeze"/>
      <animate attributeName="x2" values="450;528" dur="0.7s" begin="1.9s" fill="freeze"/>
    </line>
  </g>
</svg>
