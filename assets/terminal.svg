<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none" role="img" aria-label="Koda translating natural language into shell commands">
  <defs>
    <clipPath id="l1"><rect x="76" y="88" width="0" height="26"><animate attributeName="width" values="0;372" dur="1.3s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="126" width="0" height="26"><animate attributeName="width" values="0;196" dur="0.8s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="170" width="0" height="26"><animate attributeName="width" values="0;150" dur="0.7s" begin="3.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="204" width="0" height="26"><animate attributeName="width" values="0;190" dur="0.8s" begin="4.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="238" width="0" height="26"><animate attributeName="width" values="0;130" dur="0.6s" begin="5.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="274" width="0" height="26"><animate attributeName="width" values="0;300" dur="1.0s" begin="6.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="win"><rect x="1" y="1" width="898" height="318" rx="14"/></clipPath>
  </defs>

  <!-- Window -->
  <rect x="1" y="1" width="898" height="318" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <g clip-path="url(#win)">
    <!-- Title bar -->
    <rect x="0" y="0" width="900" height="44" fill="#161B22"/>
    <line x1="0" y1="44" x2="900" y2="44" stroke="#21262D" stroke-width="1"/>
    <circle cx="26" cy="22" r="6" fill="none" stroke="#484F58" stroke-width="1.4"/>
    <circle cx="48" cy="22" r="6" fill="none" stroke="#484F58" stroke-width="1.4"/>
    <circle cx="70" cy="22" r="6" fill="none" stroke="#484F58" stroke-width="1.4"/>
    <text x="450" y="27" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="12"
          fill="#8B949E" text-anchor="middle" letter-spacing="2">koda — zsh</text>

    <g font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="15">
      <!-- Voice waveform -->
      <g fill="#FFFFFF">
        <rect x="40" y="93" width="3" height="16" rx="1.5"><animate attributeName="height" values="6;20;6" dur="0.9s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="96;89;96" dur="0.9s" begin="0s" repeatCount="indefinite"/></rect>
        <rect x="48" y="93" width="3" height="16" rx="1.5"><animate attributeName="height" values="6;22;6" dur="0.9s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="96;88;96" dur="0.9s" begin="0.15s" repeatCount="indefinite"/></rect>
        <rect x="56" y="93" width="3" height="16" rx="1.5"><animate attributeName="height" values="6;18;6" dur="0.9s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="96;90;96" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></rect>
        <rect x="64" y="93" width="3" height="16" rx="1.5"><animate attributeName="height" values="6;22;6" dur="0.9s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="96;88;96" dur="0.9s" begin="0.45s" repeatCount="indefinite"/></rect>
      </g>

      <!-- Voice transcript (types in) -->
      <text x="76" y="107" fill="#8B949E" clip-path="url(#l1)">"open koda and start the dev server"</text>

      <!-- Translating -->
      <text x="40" y="145" fill="#6E7681" clip-path="url(#l2)">→ translating intent</text>

      <!-- Commands -->
      <text x="40" y="189" fill="#C9D1D9" clip-path="url(#l3)"><tspan fill="#484F58">$ </tspan>cd ~/dev/koda</text>
      <text x="40" y="223" fill="#C9D1D9" clip-path="url(#l4)"><tspan fill="#484F58">$ </tspan>git pull --rebase</text>
      <text x="40" y="257" fill="#C9D1D9" clip-path="url(#l5)"><tspan fill="#484F58">$ </tspan>npm run dev</text>

      <!-- Result -->
      <text x="40" y="293" fill="#8B949E" clip-path="url(#l6)"><tspan fill="#FFFFFF">✓ </tspan>ready · http://localhost:3000</text>

      <!-- Blinking cursor, forever -->
      <rect x="342" y="278" width="9" height="18" fill="#FFFFFF" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1" keyTimes="0;0.58;0.62;0.68;0.72;0.78;0.82;0.88;1" dur="11s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
