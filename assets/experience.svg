<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 389" width="860" height="389" fill="none" role="img" aria-label="Experience: Koda, Co-Founder (Feb 2026 – Sep 2026); Standard, Lead Software Engineer (June 2025 – Dec 2025)">
  <title>Experience: Koda, Co-Founder (Feb 2026 – Sep 2026); Standard, Lead Software Engineer (June 2025 – Dec 2025)</title>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .rise { animation: rise .35s ease-out both; }
    .fade { animation: fade .4s ease-out both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hold { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
