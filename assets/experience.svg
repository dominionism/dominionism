  <circle cx="38" cy="15.0" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="15.0" r="5.5" fill="#28C840"/>
  <text x="430.0" y="19.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="middle">Experience</text>
  <text x="24" y="66.0" font-size="14" font-weight="700"><tspan fill="#3FB950">Koda</tspan><tspan fill="#8B949E"> · </tspan><tspan fill="#E6EDF3">Co-Founder</tspan></text>
  <text x="836" y="66.0" font-size="12" fill="#8B949E" text-anchor="end">Feb 2026 – Sep 2026</text>
  <text x="24" y="89.0" font-size="12.5" fill="#C9D1D9" font-style="italic">Building an intelligent macOS personal agent translating natural language to system-level execution</text>
  <text x="24" y="108.0" font-size="12.5" fill="#C9D1D9" font-style="italic">tailored for developer workflows.</text>
  <text x="28" y="131.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="131.0" font-size="12.5" fill="#C9D1D9">Built a macOS menu bar utility using on-device STT for real-time shell, git, and app management</text>
  <text x="28" y="153.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="153.0" font-size="12.5" fill="#C9D1D9">Implemented hybrid AI orchestration using local pattern-matching for zero-latency and cloud-based</text>
  <text x="46" y="172.0" font-size="12.5" fill="#C9D1D9">LLM function calling for complex intent</text>
  <text x="28" y="194.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="194.0" font-size="12.5" fill="#C9D1D9">Integrated pre-execution command guards and macOS Keychain for encrypted credential storage</text>
  <text x="24" y="235.0" font-size="14" font-weight="700"><tspan fill="#3FB950">Standard</tspan><tspan fill="#8B949E"> · </tspan><tspan fill="#E6EDF3">Lead Software Engineer</tspan></text>
  <text x="836" y="235.0" font-size="12" fill="#8B949E" text-anchor="end">June 2025 – Dec 2025</text>
  <text x="24" y="258.0" font-size="12.5" fill="#C9D1D9" font-style="italic">Prototyping and scaling a real-time real estate data intelligence platform.</text>
  <text x="28" y="281.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="281.0" font-size="12.5" fill="#C9D1D9">Led full-stack development of a platform processing <tspan fill="#E6EDF3" font-weight="700">40,000+ spatial data records</tspan>, featured at</text>
  <text x="46" y="300.0" font-size="12.5" fill="#C9D1D9"><tspan fill="#E6EDF3" font-weight="700">NAR NXT 2025</tspan></text>
  <text x="28" y="322.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="322.0" font-size="12.5" fill="#C9D1D9">Built production ETL pipelines in Python (Scrapy) with schema versioning and incremental</text>
  <text x="46" y="341.0" font-size="12.5" fill="#C9D1D9">validation</text>
  <text x="28" y="363.0" font-size="12.5" fill="#3FB950">▸</text>
  <text x="46" y="363.0" font-size="12.5" fill="#C9D1D9">Optimized query latency by <tspan fill="#E6EDF3" font-weight="700">80%</tspan> (5s → 1s) via MongoDB aggregation and multi-tier Redis caching</text>
