name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - scripts/terminal.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both scripts are stdlib-only, so the runner's python3 is all they need
      - run: python3 scripts/fetch_contributions.py
      - run: python3 scripts/render_heatmap_svg.py

      # main only accepts PRs that pass CodeQL, so the bot can't push the graph there. Publish
      # it to its own branch as a single commit each run replaces; the README loads it from there.
      - name: Publish to the profile-art branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan profile-art
          git add -f assets/contrib-heatmap.svg data/contributions.json
          git commit -qm "chore: refresh contribution graph"
          git push -f origin profile-art
